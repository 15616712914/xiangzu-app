<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>湖南足球赛果管理</title>
    <style>
      :root {
        --chili: #d7261e;
        --ink: #141011;
        --paper: #f3eee6;
        --muted: rgba(20, 16, 17, 0.45);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      }
      header {
        padding: 22px 28px;
        background: var(--ink);
        color: #fff;
      }
      header h1 { margin: 0; font-size: 22px; }
      header p { margin: 6px 0 0; color: rgba(255, 255, 255, 0.55); font-size: 12px; }
      .bar {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        padding: 16px 28px 8px;
      }
      .bar input, .bar select, .row input, .row select, .row button, .filters button, .bar button {
        border: 1px solid rgba(20, 16, 17, 0.12);
        border-radius: 8px;
        padding: 8px 10px;
        background: #fff;
        color: var(--ink);
        font: inherit;
        font-size: 13px;
      }
      .bar input[type="password"] { width: 190px; }
      .bar input[type="search"] { flex: 1; min-width: 160px; }
      .bar button, .row button, .filters button.active {
        border: none;
        background: var(--ink);
        color: #fff;
        font-weight: 700;
        cursor: pointer;
      }
      .bar button:hover, .row button:hover { background: var(--chili); }
      .filters { display: flex; gap: 8px; padding: 0 28px 10px; flex-wrap: wrap; }
      .filters button { cursor: pointer; background: #fff; color: var(--ink); }
      .filters button.active { background: var(--ink); color: #fff; }
      main { padding: 0 28px 40px; }
      table {
        width: 100%;
        border-collapse: collapse;
        background: #fff;
        border-radius: 12px;
        overflow: hidden;
        font-size: 13px;
      }
      th, td { padding: 9px 10px; text-align: left; border-bottom: 1px solid rgba(20, 16, 17, 0.06); }
      th { color: var(--muted); font-size: 11px; font-weight: 600; background: #faf7f2; }
      tr:last-child td { border-bottom: none; }
      .teams { font-weight: 700; }
      .goal { width: 54px; text-align: center; }
      .minute, .attendance { width: 74px; }
      .status { width: 104px; }
      .muted { color: var(--muted); font-size: 11px; }
      .live { color: var(--chili); font-weight: 700; }
      #rows input, #rows select {
        border: 1px solid rgba(20, 16, 17, 0.14);
        border-radius: 6px;
        padding: 6px 8px;
        background: #fff;
        color: var(--ink);
        font: inherit;
        font-size: 13px;
      }
      #rows .save {
        border: none;
        background: var(--ink);
        color: #fff;
        font-weight: 700;
        font-size: 12px;
        padding: 7px 14px;
        border-radius: 6px;
        cursor: pointer;
      }
      #rows .save:hover { background: var(--chili); }
      #rows .save:disabled { opacity: 0.45; cursor: default; }
      .sync-status { font-size: 11px; color: var(--muted); margin-left: 4px; }
      .sync-status.ok { color: #2f7d57; }
      .sync-status.err { color: var(--chili); font-weight: 700; }
      .ai-panel { display: none; margin-top: 18px; background: #fff; border-radius: 12px; padding: 16px; }
      .ai-panel.open { display: block; }
      .ai-panel h2 { font-size: 14px; margin: 0 0 6px; }
      .ai-panel p { margin: 0 0 10px; }
      .ai-grid { display: flex; gap: 8px; flex-wrap: wrap; }
      .ai-grid select { min-width: 220px; }
      .ai-grid input { flex: 1; min-width: 220px; }
      .ai-panel textarea {
        width: 100%; min-height: 88px; margin-top: 8px; padding: 8px 10px;
        border: 1px solid rgba(20, 16, 17, 0.14); border-radius: 6px;
        font: inherit; font-size: 13px; resize: vertical;
      }
      .ai-list { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
      .ai-item { border: 1px solid rgba(20, 16, 17, 0.1); border-radius: 8px; padding: 10px 12px; }
      .ai-item .ai-title { font-weight: 700; font-size: 13px; }
      .ai-item .ai-meta { color: var(--muted); font-size: 11px; margin: 4px 0 8px; line-height: 1.5; }
      .ai-item .ai-actions { display: flex; gap: 8px; }
      .ai-item .ai-actions button { border: none; border-radius: 6px; padding: 6px 12px; font-size: 12px; font-weight: 700; cursor: pointer; }
      .ai-item .accept { background: var(--ink); color: #fff; }
      .ai-item .reject { background: #eee; color: var(--ink); }
      .toast {
        position: fixed;
        right: 20px;
        bottom: 20px;
        padding: 10px 16px;
        border-radius: 999px;
        background: var(--ink);
        color: #fff;
        font-size: 13px;
        opacity: 0;
        transform: translateY(8px);
        transition: 0.2s;
        pointer-events: none;
      }
      .toast.show { opacity: 1; transform: none; }
      .hint { padding: 0 28px 10px; color: var(--muted); font-size: 12px; line-height: 1.6; }
      .log { margin-top: 18px; display: none; }
      .log.open { display: block; }
      .log h2 { font-size: 14px; margin: 0 0 8px; }
      .log ol { margin: 0; padding: 14px 18px 14px 34px; background: #fff; border-radius: 12px; font-size: 12px; line-height: 1.9; }
      .log code { font-size: 11px; color: var(--muted); }
      @media (max-width: 760px) {
        .bar, main, .hint, .filters { padding-left: 14px; padding-right: 14px; }
        th:nth-child(2), td:nth-child(2) { display: none; }
        .minute, .attendance { width: 58px; }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>湖南足球赛果管理</h1>
      <p>保存前自动备份 data.json；比分、状态、live 分钟和现场人数会立即同步到 App。</p>
    </header>

    <div class="bar">
      <input id="token" type="password" placeholder="管理令牌" autocomplete="off" />
      <input id="search" type="search" placeholder="搜索球队 / 轮次 / 日期" />
      <button id="sync">同步官方</button>
      <span id="sync-status" class="sync-status"></span>
      <button id="ai-toggle">AI 建议</button>
      <button id="refresh">刷新</button>
      <button id="log-toggle">操作记录</button>
    </div>
    <div class="filters">
      <button data-filter="all" class="active">全部</button>
      <button data-filter="live">进行中</button>
      <button data-filter="upcoming">待开赛</button>
      <button data-filter="finished">已完场</button>
    </div>
    <div class="hint">
      令牌只保存在当前标签页（sessionStorage），关闭标签页即清除。上线请用环境变量
      <code>ADMIN_TOKEN</code> 设置强令牌，并把后台限制在内网或登录保护后。
      「同步官方」会从足球中国公开赛程拉取完场比分；自动同步每 10 分钟运行一次。
    </div>

    <main>
      <section id="ai-panel" class="ai-panel">
        <h2>AI 战报解析</h2>
        <p class="muted">粘贴官方战报链接或正文。AI 只提取原文里出现的点球、现场人数和比分，不会猜。</p>
        <div class="ai-grid">
          <select id="ai-match"></select>
          <input id="ai-url" placeholder="战报链接（可选）" />
          <button id="ai-scan">AI 解析</button>
        </div>
        <textarea id="ai-text" placeholder="或者直接粘贴战报正文"></textarea>
        <div id="ai-list" class="ai-list"></div>
      </section>

      <table>
        <thead>
          <tr>
            <th>比赛</th>
            <th>日期</th>
            <th>对阵</th>
            <th>主队</th>
            <th>客队</th>
            <th>分钟</th>
            <th>现场人数</th>
            <th>状态</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>

      <section id="log" class="log">
        <h2>最近操作</h2>
        <ol id="log-rows"></ol>
      </section>
    </main>

    <div id="toast" class="toast"></div>

    <script>
      let matches = []
      let teamNames = {}
      let filter = 'all'
      const tokenInput = document.getElementById('token')
      tokenInput.value = sessionStorage.getItem('xc-admin-token') || ''
      tokenInput.addEventListener('input', () => {
        sessionStorage.setItem('xc-admin-token', tokenInput.value)
      })

      const $ = (id) => document.getElementById(id)
      const esc = (value) =>
        String(value).replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]))
      const toast = (text) => {
        const el = $('toast')
        el.textContent = text
        el.classList.add('show')
        setTimeout(() => el.classList.remove('show'), 1800)
      }

      const cityOf = (id) => teamNames[id] || id

      function stageOf(match) {
        return match.phase === 'knockout' ? match.stage || '淘汰赛' : `第${match.round}轮`
      }

      function visibleMatches() {
        const q = $('search').value.trim()
        return matches
          .filter((m) => filter === 'all' || m.status === filter)
          .filter((m) => {
            if (!q) return true
            return `${cityOf(m.home)} ${cityOf(m.away)} ${m.round} ${m.date} ${stageOf(m)}`.includes(q)
          })
          .sort((a, b) => {
            const rank = { live: 0, upcoming: 1, finished: 2 }
            if (rank[a.status] !== rank[b.status]) return rank[a.status] - rank[b.status]
            if (a.date !== b.date) return a.status === 'finished' ? b.date.localeCompare(a.date) : a.date.localeCompare(b.date)
            return a.time.localeCompare(b.time)
          })
      }

      function render() {
        $('rows').innerHTML = visibleMatches()
          .map((m) => {
            const live = m.status === 'live'
            return `
              <tr data-id="${m.id}">
                <td class="muted">${esc(stageOf(m))}</td>
                <td class="muted">${m.date} ${m.time}</td>
                <td class="teams">${esc(cityOf(m.home))} vs ${esc(cityOf(m.away))}</td>
                <td><input class="goal" type="number" min="0" max="20" value="${m.homeGoals}" data-side="home" /></td>
                <td><input class="goal" type="number" min="0" max="20" value="${m.awayGoals}" data-side="away" /></td>
                <td><input class="minute" type="number" min="0" max="90" value="${live ? m.startMinute ?? 0 : ''}" placeholder="—" ${live ? '' : 'disabled'} /></td>
                <td><input class="attendance" type="number" min="0" max="200000" value="${m.attendance || ''}" placeholder="未知" /></td>
                <td>
                  <select class="status">
                    ${['upcoming', 'live', 'finished']
                      .map((s) => `<option value="${s}" ${m.status === s ? 'selected' : ''}>${s}</option>`)
                      .join('')}
                  </select>
                </td>
                <td><button class="save">保存</button></td>
              </tr>
            `
          })
          .join('')
        if (!visibleMatches().length) {
          $('rows').innerHTML = '<tr><td colspan="9" class="muted">没有符合条件的比赛。</td></tr>'
        }
      }

      async function load() {
        const res = await fetch('/api/league')
        if (!res.ok) throw new Error('加载失败')
        const data = await res.json()
        matches = data.matches
        teamNames = Object.fromEntries(data.teams.map((team) => [team.id, team.city]))
        render()
        fillAiMatches()
        loadSyncStatus()
      }

      async function loadLog() {
        if (!$('log').classList.contains('open')) return
        if (!tokenInput.value) {
          $('log-rows').innerHTML = '<li class="muted">先填入管理令牌。</li>'
          return
        }
        const res = await fetch('/api/admin/log', { headers: { 'x-admin-token': tokenInput.value } })
        if (!res.ok) {
          $('log-rows').innerHTML = '<li class="muted">令牌无效，无法读取操作记录。</li>'
          return
        }
        const data = await res.json()
        $('log-rows').innerHTML = data.entries.length
          ? data.entries
              .map((entry) => {
                const before = entry.before
                const after = entry.after
                return `<li>${new Date(entry.at).toLocaleString('zh-CN')} · <code>${esc(entry.matchId)}</code> · ${esc(before.status)}→${esc(after.status)} · ${before.homeGoals}:${before.awayGoals}→${after.homeGoals}:${after.awayGoals}${after.startMinute === undefined ? '' : ` · ${after.startMinute}'`}</li>`
              })
              .join('')
          : '<li class="muted">还没有操作记录。</li>'
      }

      $('rows').addEventListener('change', (event) => {
        if (!event.target.classList.contains('status')) return
        const tr = event.target.closest('tr')
        const minute = tr.querySelector('.minute')
        const live = event.target.value === 'live'
        minute.disabled = !live
        if (live && minute.value === '') minute.value = 0
      })

      $('rows').addEventListener('click', async (event) => {
        const button = event.target.closest('.save')
        if (!button) return
        const tr = button.closest('tr')
        const id = tr.dataset.id
        const homeGoals = Number(tr.querySelector('[data-side="home"]').value)
        const awayGoals = Number(tr.querySelector('[data-side="away"]').value)
        const status = tr.querySelector('.status').value
        const minuteRaw = tr.querySelector('.minute').value
        const attendanceRaw = tr.querySelector('.attendance').value
        const body = {
          status,
          homeGoals,
          awayGoals,
          startMinute: status === 'live' ? Number(minuteRaw || 0) : undefined,
          attendance: attendanceRaw === '' ? 0 : Number(attendanceRaw),
        }
        if (!tokenInput.value) {
          toast('请先填入管理令牌')
          return
        }
        button.disabled = true
        try {
          const res = await fetch(`/api/admin/matches/${id}`, {
            method: 'POST',
            headers: {
              'content-type': 'application/json',
              'x-admin-token': tokenInput.value,
            },
            body: JSON.stringify(body),
          })
          const data = await res.json()
          if (!res.ok) throw new Error(data.error || '保存失败')
          toast(`已保存 ${id}：${homeGoals}:${awayGoals}`)
          await load()
          await loadLog()
        } catch (e) {
          toast(e.message)
        } finally {
          button.disabled = false
        }
      })

      document.querySelector('.filters').addEventListener('click', (event) => {
        const button = event.target.closest('button[data-filter]')
        if (!button) return
        filter = button.dataset.filter
        document.querySelectorAll('.filters button').forEach((item) => {
          item.classList.toggle('active', item === button)
        })
        render()
      })

      function fillAiMatches() {
        const finished = matches.filter((m) => m.status === 'finished').slice(0, 12)
        $('ai-match').innerHTML = finished
          .map((m) => `<option value="${m.id}">${m.date} ${cityOf(m.home)} vs ${cityOf(m.away)} ${m.homeGoals}:${m.awayGoals}</option>`)
          .join('')
      }

      function renderSuggestions(entries) {
        const label = { penalty: '点球比分', attendance: '现场人数', score: '比分' }
        if (!entries.length) {
          $('ai-list').innerHTML = '<div class="muted">没有待处理建议。</div>'
          return
        }
        $('ai-list').innerHTML = entries.map((entry) => {
          const match = matches.find((m) => m.id === entry.matchId)
          const teams = match ? `${cityOf(match.home)} vs ${cityOf(match.away)}` : entry.matchId
          const before = Array.isArray(entry.before) ? entry.before.join(':') : entry.before
          const after = Array.isArray(entry.after) ? entry.after.join(':') : entry.after
          return `<div class="ai-item">
            <div class="ai-title">${esc(teams)} · ${label[entry.field] || entry.field}</div>
            <div class="ai-meta">当前 ${esc(before)} → 建议 ${esc(after)} · 置信度 ${Math.round(entry.confidence * 100)}%<br>${esc(entry.evidence || '')}<br>来源：${esc(entry.source)}</div>
            <div class="ai-actions">
              <button class="accept" data-id="${entry.id}" data-action="accept">采纳</button>
              <button class="reject" data-id="${entry.id}" data-action="reject">忽略</button>
            </div>
          </div>`
        }).join('')
      }

      async function loadSuggestions() {
        if (!tokenInput.value) {
          $('ai-list').innerHTML = '<div class="muted">先填入管理令牌。</div>'
          return
        }
        const res = await fetch('/api/admin/suggestions', { headers: { 'x-admin-token': tokenInput.value } })
        if (!res.ok) {
          $('ai-list').innerHTML = '<div class="muted">令牌无效，无法读取建议。</div>'
          return
        }
        renderSuggestions((await res.json()).entries)
      }

      async function loadSyncStatus() {
        if (!tokenInput.value) return
        const el = $('sync-status')
        try {
          const res = await fetch('/api/admin/sync-status', { headers: { 'x-admin-token': tokenInput.value } })
          if (!res.ok) return
          const { status } = await res.json()
          if (!status) return
          if (status.ok) {
            el.className = 'sync-status ok'
            el.textContent = `同步 ${new Date(status.at).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' })}`
            el.title = status.skipped || ''
          } else {
            el.className = 'sync-status err'
            el.textContent = '同步失败'
            el.title = status.error || ''
          }
        } catch {
          // Status is optional; the table still works.
        }
      }

      $('ai-toggle').addEventListener('click', () => {
        $('ai-panel').classList.toggle('open')
        loadSuggestions()
        if ($('ai-panel').classList.contains('open')) {
          $('ai-panel').scrollIntoView({ behavior: 'smooth', block: 'start' })
        }
      })

      $('ai-scan').addEventListener('click', async () => {
        if (!tokenInput.value) { toast('请先填入管理令牌'); return }
        const button = $('ai-scan')
        button.disabled = true
        try {
          const res = await fetch('/api/admin/suggestions/scan', {
            method: 'POST',
            headers: { 'content-type': 'application/json', 'x-admin-token': tokenInput.value },
            body: JSON.stringify({
              matchId: $('ai-match').value,
              sourceUrl: $('ai-url').value.trim(),
              text: $('ai-text').value.trim(),
            }),
          })
          const data = await res.json()
          if (!res.ok) throw new Error(data.error || 'AI 解析失败')
          toast(data.created ? `生成 ${data.created} 条建议` : (data.reason || '没有新建议'))
          await loadSuggestions()
        } catch (e) {
          toast(e.message)
        } finally {
          button.disabled = false
        }
      })

      $('ai-list').addEventListener('click', async (event) => {
        const button = event.target.closest('button[data-id]')
        if (!button) return
        if (!tokenInput.value) { toast('请先填入管理令牌'); return }
        button.disabled = true
        try {
          const res = await fetch(`/api/admin/suggestions/${button.dataset.id}/${button.dataset.action}`, {
            method: 'POST',
            headers: { 'x-admin-token': tokenInput.value },
          })
          const data = await res.json()
          if (!res.ok) throw new Error(data.error || '处理失败')
          toast(button.dataset.action === 'accept' ? '已采纳并写入' : '已忽略')
          await load()
          await loadSuggestions()
        } catch (e) {
          toast(e.message)
        } finally {
          button.disabled = false
        }
      })

      $('sync').addEventListener('click', async () => {
        if (!tokenInput.value) {
          toast('请先填入管理令牌')
          return
        }
        const button = $('sync')
        button.disabled = true
        try {
          const res = await fetch('/api/admin/sync-official?force=1&players=1', {
            method: 'POST',
            headers: { 'x-admin-token': tokenInput.value },
          })
          const data = await res.json()
          if (!res.ok) throw new Error(data.error || '同步失败')
          if (data.skipped) {
            toast(data.skipped)
          } else {
            toast(`已同步：${data.matchesUpdated} 场比分，${data.playersUpdated} 名球员`)
            await load()
            await loadSyncStatus()
          }
        } catch (e) {
          toast(e.message)
        } finally {
          button.disabled = false
        }
      })

      $('refresh').addEventListener('click', () => {
        load().catch((e) => toast(e.message))
        loadLog()
      })
      $('log-toggle').addEventListener('click', () => {
        $('log').classList.toggle('open')
        loadLog()
      })
      $('search').addEventListener('input', render)
      load().catch((e) => toast(e.message))
    </script>
  </body>
</html>
