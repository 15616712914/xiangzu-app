services:
  - type: web
    name: xiangchao-api
    runtime: docker
    # Free plan needs no card, but the filesystem is ephemeral:
    # accounts/votes can reset when the service restarts or redeploys.
    # Upgrade to starter + disk before real account testing.
    plan: free
    dockerContext: .
    dockerfilePath: ./server/Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: ADMIN_TOKEN
        generateValue: true
      - key: APPLE_CLIENT_ID
        value: com.xiangchao.app
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
