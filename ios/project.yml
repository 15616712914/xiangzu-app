name: XiangChao
options:
  bundleIdPrefix: com.xiangchao
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
  configs:
    Debug:
      XC_API_BASE_URL: "http://127.0.0.1:8787"
    Release:
      XC_API_BASE_URL: "https://reservoir-expired-concord-handed.trycloudflare.com"
targets:
  XiangChao:
    type: application
    platform: iOS
    sources:
      - path: XiangChao
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xiangchao.app
        PRODUCT_NAME: XiangChao
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
    entitlements:
      path: Support/XiangChao.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: 湘足
        CFBundleName: XiangChao
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations:
          - zh-Hans
        CFBundleIconName: AppIcon
        LSApplicationCategoryType: public.app-category.sports
        ITSAppUsesNonExemptEncryption: false
        XCApiBaseURL: $(XC_API_BASE_URL)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIApplicationSupportsIndirectInputEvents: true
        UIUserInterfaceStyle: Light
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIViewControllerBasedStatusBarAppearance: true
        NSHumanReadableCopyright: "© 2026 湘足"

  XiangChaoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: XiangChaoTests
    dependencies:
      - target: XiangChao
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xiangchao.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/XiangChao.app/XiangChao"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  XiangChao:
    build:
      targets:
        XiangChao: all
        XiangChaoTests: [test]
    test:
      targets:
        - XiangChaoTests
